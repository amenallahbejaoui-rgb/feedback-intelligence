[project]
name = "feedback-intelligence"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "pydantic>=2.0",
  "pyyaml",
  "python-dotenv",
  "scikit-learn",
  "duckdb",
  "tqdm",
  "google-play-scraper",
  "langdetect",
  "emoji",
]

[project.optional-dependencies]
nlp = [
  "sentence-transformers",
  "bertopic",
  "umap-learn",
  "hdbscan",
  "transformers",
  "datasets",
  "torch",
  "ruptures",
]
app = ["fastapi", "uvicorn", "streamlit", "plotly"]
dev = ["pytest", "ruff", "pre-commit", "dvc", "jupyterlab", "label-studio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]